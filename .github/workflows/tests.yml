name: config-tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      NVIM_CONFIG_TEST: "1"
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: "true"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Neovim 0.12
        uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1
        with:
          neovim: true
          version: v0.12.4

      - name: Prepare isolated config
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/xdg/nvim"
          cp -R . "$RUNNER_TEMP/xdg/nvim"
          echo "XDG_CONFIG_HOME=$RUNNER_TEMP/xdg" >> "$GITHUB_ENV"
          echo "NVIM_TEST_ROOT=$RUNNER_TEMP/xdg/nvim" >> "$GITHUB_ENV"

      - name: Show Neovim version
        run: nvim --version

      - name: Run config test suite
        shell: bash
        run: |
          cd "$NVIM_TEST_ROOT"
          output=$(nvim --headless "+lua dofile(vim.fs.joinpath(vim.fn.getcwd(), 'tests', 'run.lua'))" 2>&1)
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -q 'CONFIG_TEST_SUITE_OK'

      - name: Verify SSH clipboard strategy
        if: runner.os == 'Linux'
        shell: bash
        env:
          SSH_CONNECTION: "192.0.2.1 12345 192.0.2.2 22"
        run: |
          cd "$NVIM_TEST_ROOT"
          output=$(nvim --headless "+lua local p=require('config.platform'); assert(p.is_remote and p.is_ssh); assert(vim.g.clipboard == 'osc52'); assert(not vim.tbl_contains(vim.opt.clipboard:get(), 'unnamedplus')); assert(vim.fn.maparg('<leader>y', 'n') == '\"+y'); print('REMOTE_CLIPBOARD_OK')" "+qa!" 2>&1)
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -q 'REMOTE_CLIPBOARD_OK'

  mason-first-boot:
    name: ubuntu-mason-first-boot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NVIM_BOOTSTRAP: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Neovim 0.12
        uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1
        with:
          neovim: true
          version: v0.12.4

      - name: Prepare disposable XDG environment
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/first-boot/config/nvim" "$RUNNER_TEMP/first-boot/data" "$RUNNER_TEMP/first-boot/state" "$RUNNER_TEMP/first-boot/cache"
          cp -R . "$RUNNER_TEMP/first-boot/config/nvim"
          {
            echo "XDG_CONFIG_HOME=$RUNNER_TEMP/first-boot/config"
            echo "XDG_DATA_HOME=$RUNNER_TEMP/first-boot/data"
            echo "XDG_STATE_HOME=$RUNNER_TEMP/first-boot/state"
            echo "XDG_CACHE_HOME=$RUNNER_TEMP/first-boot/cache"
            echo "NVIM_TEST_ROOT=$RUNNER_TEMP/first-boot/config/nvim"
          } >> "$GITHUB_ENV"

      - name: Run Linux bootstrap and install all Mason packages
        shell: bash
        run: |
          cd "$NVIM_TEST_ROOT"
          bash scripts/bootstrap-linux.sh

      - name: Attach representative LSP servers and run formatters
        shell: bash
        run: |
          cd "$NVIM_TEST_ROOT"
          output=$(nvim --headless init.lua "+luafile $NVIM_TEST_ROOT/tests/check_first_boot_runtime.lua" 2>&1)
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -q 'FIRST_BOOT_RUNTIME_OK'

  bootstrap-windows-logic:
    name: windows-bootstrap-logic
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Runs only the safe logic tests for scripts/bootstrap-windows.ps1 with
      # fake native commands. Never runs the destructive full bootstrap.
      - name: Run safe Windows bootstrap logic tests (PowerShell 7)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & "$env:GITHUB_WORKSPACE/scripts/test-bootstrap-windows.ps1"

      - name: Run safe Windows bootstrap logic tests (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          & "$env:GITHUB_WORKSPACE/scripts/test-bootstrap-windows.ps1"

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          # Production script: full rule set, must be clean.
          $prod = Invoke-ScriptAnalyzer -Path scripts/bootstrap-windows.ps1
          # Test script: fake-executor scriptblocks legitimately ignore their
          # parameters, Assert-Throws has an intentionally plural noun,
          # Reset-TestState mutates in-memory test state, and test output is
          # written to the host.
          $test = Invoke-ScriptAnalyzer -Path scripts/test-bootstrap-windows.ps1 `
            -Severity Warning `
            -ExcludeRule PSUseSingularNouns, PSReviewUnusedParameter, PSAvoidUsingWriteHost, PSUseShouldProcessForStateChangingFunctions
          $prod | Format-Table -AutoSize
          $test | Format-Table -AutoSize
          if ($prod -or $test) { exit 1 }

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Official StyLua action. Tag v4 instead of a SHA pin: the pinning SHA
      # could not be resolved at authoring time — resolve at the next pass.
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          args: --check .

      - name: Bash syntax, diff check, version drift
        run: |
          for f in scripts/*.sh .githooks/pre-commit; do bash -n "$f" || exit 1; done
          git diff --check
          wf_version=$(grep -oP 'version: v\K[0-9.]+' .github/workflows/tests.yml | sort -u | head -1)
          sh_version=$(grep -oP '^NVIM_VERSION="\K[0-9.]+' scripts/versions.sh)
          test "$wf_version" = "$sh_version" || {
            echo "workflow nvim version ($wf_version) != versions.sh ($sh_version)"; exit 1; }

      - name: ShellCheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck -x scripts/*.sh .githooks/pre-commit

  windows-first-boot:
    # Manual (workflow_dispatch) integration channel: a real Windows first
    # boot without the expensive winget system installs. Validates Mason
    # package installation and the full first-boot runtime checks on native
    # Windows (shims, .CMD resolution, PATH).
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      NVIM_BOOTSTRAP: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1
        with:
          neovim: true
          version: v0.12.4

      - name: Ensure rustfmt component (runner toolchain may lack it)
        run: rustup component add rustfmt

      - name: Prepare disposable XDG environment
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/cfg/nvim"
          cp -R . "$RUNNER_TEMP/cfg/nvim"
          {
            echo "XDG_CONFIG_HOME=$RUNNER_TEMP/cfg"
            echo "XDG_DATA_HOME=$RUNNER_TEMP/data"
            echo "XDG_STATE_HOME=$RUNNER_TEMP/state"
            echo "XDG_CACHE_HOME=$RUNNER_TEMP/cache"
            echo "NVIM_TEST_ROOT=$RUNNER_TEMP/cfg/nvim"
          } >> "$GITHUB_ENV"

      - name: Install Mason packages (synchronous)
        run: |
          cd "$NVIM_TEST_ROOT"
          nvim --headless "+MasonToolsInstallSync" "+qa!"

      - name: First-boot runtime checks
        run: |
          cd "$NVIM_TEST_ROOT"
          output=$(nvim --headless init.lua "+luafile tests/check_first_boot_runtime.lua" 2>&1)
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -q 'FIRST_BOOT_RUNTIME_OK'
